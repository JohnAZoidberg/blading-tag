# --- Bluetooth -------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="BladeTag"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=16

CONFIG_BT_DIS=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="nRF54L15 Tag"
CONFIG_BT_DIS_FW_REV=y

# ATT MTU 247 and full-size LL packets: one Data notification = 19 samples.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Connection parameters from PROTOCOL.md 1.2: 30-50 ms, latency 0, 4 s
# supervision timeout, 2M PHY.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_AUTO_PHY_PERIPHERAL_2M=y

# Control writes run in the BT RX thread and save settings / talk to the IMU.
CONFIG_BT_RX_STACK_SIZE=3072

# --- Firmware updates over BLE (MCUboot + mcumgr SMP) -----------------------
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
# A crash resets instead of halting, so MCUboot can revert an unconfirmed image.
CONFIG_RESET_ON_FATAL_ERROR=y

# --- Sensors ---------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_SENSOR=y
# The BMI270 driver does the chip init; src/imu.c runs the FIFO itself.
CONFIG_BMI270=y
CONFIG_BMI270_TRIGGER_NONE=y
# src/motion.c drives the ADXL367 directly. BME688 is unused.
CONFIG_ADXL367=n
CONFIG_BME680=n
CONFIG_ADC=y

# --- Persistence (session_id, position) -------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y

# --- Power -------------------------------------------------------------------
CONFIG_POWEROFF=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072

# Logging over RTT (J-Link). The Tag has no UART connector.
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=y
