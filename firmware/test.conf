# Test build for the hardware tests in host/tests/hw (make build-test).
# Applied on top of prj.conf. Don't ship it: it polls a RAM mailbox.
CONFIG_BLADING_TEST_HOOKS=y
# The tag sits still in the DK header between test runs, and the J-Link can't
# wake it from System OFF.
CONFIG_BLADING_IDLE_SLEEP_S=0
