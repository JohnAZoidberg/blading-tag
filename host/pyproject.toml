[project]
name = "bladetag"
version = "0.1.0"
description = "Laptop tools for blading-tag: BLE recorder, live plot, session analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
ble = ["bleak>=0.22"]
plot = ["matplotlib>=3.7"]
all = ["bleak>=0.22", "matplotlib>=3.7"]
dev = ["pytest>=7", "bleak>=0.22", "matplotlib>=3.7"]

[project.scripts]
bladetag = "bladetag.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bladetag = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
